[skills.adapters."eugo-cmake-review"]
divergence_inline = "NOT USED — this fork carries NO `@EUGO_CHANGE` annotations at all; every divergence lives in `CMakeLists.txt` + `cmake/pthreadpool-config.cmake.in` and is tracked ONLY by the inventory in the eugo-upstream-merge adapter (a diff that adds, removes or moves a divergence updates that inventory in the same commit). If a marker is ever introduced, use `# @EUGO_CHANGE: <why>`."
divergence_block_open = "NOT USED (no marker vocabulary in this fork — see divergence_inline); a future block form would be `# @EUGO_CHANGE: @begin <why>`"
divergence_block_close = "NOT USED (no marker vocabulary in this fork); a future block form would be `# @EUGO_CHANGE: @end`"
preserved_upstream_marker = "none — upstream's shapes are adopted wherever possible (every divergent line is merge-conflict debt); upstream's download paths are kept live under the ELSE branch of each `USE_SYSTEM_*` guard rather than commented out, so the fork still builds standalone like upstream does"
legacy_marker_forms = ""
audit_cmd = ""
snapshot_path = ""
snapshot_cmd = ""
catalog_doc = "the divergence inventory in this repo's `eugo-upstream-merge` adapter (§2 invariants) — this fork has no CLAUDE.md catalog, no markers, no audit script and no snapshot; keep that inventory current in the same commit as any divergence change"
non_negotiables = '''
1. **USE_SYSTEM_* options intact.** `USE_SYSTEM_LIBS` (default OFF, upstream-friendly) plus `USE_SYSTEM_FXDIV` / `USE_SYSTEM_GOOGLETEST` / `USE_SYSTEM_GOOGLEBENCHMARK`, each defaulting to `${USE_SYSTEM_LIBS}`. Do not flip defaults to ON — the fork must still build standalone like upstream does.
2. **Both branches of every dep guarded.** Each dependency has `FIND_PACKAGE(... REQUIRED)` under `USE_SYSTEM_*`, and the download path (`CONFIGURE_FILE(cmake/Download*.cmake ...)` + `EXECUTE_PROCESS`) only in the ELSE branch. The `ADD_SUBDIRECTORY` fallbacks further down must keep their `NOT TARGET x AND NOT USE_SYSTEM_*` guards — dropping one silently vendors a dep even in system mode.
3. **Export/install machinery must not regress** (why the fork exists): `pthreadpool_interface` keeps `$<BUILD_INTERFACE:...>` / `$<INSTALL_INTERFACE:include>` includes and is installed into `${CMAKE_PROJECT_NAME}Targets`; `CONFIGURE_PACKAGE_CONFIG_FILE` + `INSTALL(EXPORT ...)` emit `${CMAKE_INSTALL_LIBDIR}/cmake/pthreadpool/pthreadpool-config.cmake`; `cmake/pthreadpool-config.cmake.in` keeps `find_dependency(FXdiv)` — removing it breaks pytorch's `find_package(pthreadpool CONFIG REQUIRED)` at pytorch-configure time, not here.
4. **Consumer regex coupling.** protomolecule's `setup` patches these EXACT lines with `eugo_patch_or_die`: `SET(CMAKE_C_STANDARD 11)`, `SET(CMAKE_C_EXTENSIONS NO)`, `SET(CMAKE_CXX_STANDARD 11)`, `SET(CMAKE_CXX_EXTENSIONS NO)`. If a diff (or an upstream merge) reworks the "Language options" block, the downstream build fails loudly at patch time — update the setup regexes in the same adoption PR that bumps the pin.
5. **Flags that must keep working** (the canonical protomolecule invocation uses them): `PTHREADPOOL_LIBRARY_TYPE=shared`, `PTHREADPOOL_SYNC_PRIMITIVE=futex`, `PTHREADPOOL_ALLOW_DEPRECATED_API=ON`, `PTHREADPOOL_ENABLE_FASTPATH` overridable per-arch (ON x86_64 / OFF aarch64).
6. **Stay close to upstream.** Every divergent line is merge-conflict debt for the next `git merge upstream/main`. Prefer the smallest diff that works; adopt upstream shapes where possible.
'''
preflight_checks = '''
```bash
# System mode (eugo container; needs system FXdiv)
cmake -B build-sys -G Ninja -DUSE_SYSTEM_LIBS=ON -DUSE_SYSTEM_FXDIV=ON -DPTHREADPOOL_LIBRARY_TYPE=shared -DPTHREADPOOL_BUILD_TESTS=OFF -DPTHREADPOOL_BUILD_BENCHMARKS=OFF -DCMAKE_INSTALL_PREFIX="$PWD/out"
cmake --build build-sys && cmake --install build-sys
test -f out/lib*/cmake/pthreadpool/pthreadpool-config.cmake || echo "REGRESSION"
# Upstream-default mode (network; proves we did not break standalone builds)
cmake -B build-def -G Ninja
grep -n 'SET(CMAKE_C_STANDARD 11)\|SET(CMAKE_C_EXTENSIONS NO)\|SET(CMAKE_CXX_STANDARD 11)\|SET(CMAKE_CXX_EXTENSIONS NO)' CMakeLists.txt   # all four anchors present
```
If both configures pass and the config file lands in the install tree, the change is safe to commit. Anything touching the divergence inventory finishes with the eugo-upstream-merge adapter's sanity notes.
'''
failure_modes = '''
| Signature | Cause / fix |
|---|---|
| `REGRESSION` from the install-tree test (no `pthreadpool-config.cmake`) | The `CONFIGURE_PACKAGE_CONFIG_FILE` / `INSTALL(EXPORT ...)` machinery was lost — restore it; this is the fork's whole purpose. |
| `FIND_PACKAGE(FXdiv REQUIRED)` fails at configure | Outside the eugo container (no system FXdiv) — build in the container, install FXdiv the protomolecule way, or drop `USE_SYSTEM_FXDIV` for a compile-only check. |
| pytorch configure: `find_package(pthreadpool CONFIG REQUIRED)` fails on FXdiv | `find_dependency(FXdiv)` missing from `cmake/pthreadpool-config.cmake.in`. |
| protomolecule build dies at patch time on pthreadpool | One of the four `SET(CMAKE_*_STANDARD 11)` / `SET(CMAKE_*_EXTENSIONS NO)` anchors was reworked — update the setup regexes in the adoption PR. |
| a dep vendored in system mode | An `ADD_SUBDIRECTORY` fallback lost its `NOT TARGET x AND NOT USE_SYSTEM_*` guard. |
'''
related_skills = '''
